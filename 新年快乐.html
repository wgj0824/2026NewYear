<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>2026 跨年 - 粉黛流芳版</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #050002; /* 极深紫黑背景，衬托粉色 */
            font-family: "STXingkai", "Xingkai SC", "KaiTi", "STKaiti", "Brush Script MT", cursive, sans-serif;
        }
        canvas {
            display: block;
        }
    </style>
</head>
<body>
    <canvas id="canvas"></canvas>

<script>
/**
 * 2026 跨年粒子特效 - 粉黛流芳·行书版
 * 
 * 修改点：
 * 1. 【颜色】淡粉色系 (Pale Pink Palette)。
 * 2. 【字体】行书/行楷 (Calligraphy)。
 * 3. 【烟花】爆炸半径增大，视觉更震撼。
 * 4. 【流程】最后文字消失 -> 满屏无限烟花。
 */

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

let width, height;
let particles = [];
let fireworks = [];
let sparks = [];

// 配置参数
const CONFIG = {
    particleCount: 9000,     // 粒子数量
    particleSize: 1.4,       // 粒子大小
    focalLength: 350,        
    
    // 淡粉色系配色表
    pinkPalette: [
        '#FFB6C1', // 浅粉红 LightPink
        '#FFC0CB', // 粉红 Pink
        '#FFE4E1', // 雾玫瑰 MistyRose
        '#FFF0F5', // 薰衣草紫红 LavenderBlush
        '#F8C3CD', // 樱花色
        '#ffffff'  // 纯白高光
    ],

    fireworkChance: 0.1,    
    gravity: 0.07,           // 重力较轻，飘逸感
    friction: 0.96
};

let currentTransitionSpeed = 0.1;

function resize() {
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
}
window.addEventListener('resize', resize);
resize();

// -----------------------------------------------------------
// 1. 文字坐标获取 (行书 + 粉色)
// -----------------------------------------------------------
function getTextCoordinates(text, fontSize) {
    const tempCanvas = document.createElement('canvas');
    const tCtx = tempCanvas.getContext('2d');
    tempCanvas.width = width;
    tempCanvas.height = height;
    
    tCtx.textAlign = 'center';
    tCtx.textBaseline = 'middle';
    
    // 【关键】字体设置为行楷/行书风格
    // 优先尝试系统自带的华文行楷等书法字体，如果没有则回退到楷体或手写体
    tCtx.font = `${fontSize}px "STXingkai", "Xingkai SC", "KaiTi", "STKaiti", "Brush Script MT", cursive`; 
    tCtx.fillStyle = '#fff';
    tCtx.fillText(text, width / 2, height / 2);

    const imgData = tCtx.getImageData(0, 0, width, height).data;
    const points = [];
    
    // 采样步长
    const step = 2; 

    for (let y = 0; y < height; y += step) {
        for (let x = 0; x < width; x += step) {
            const alpha = imgData[(y * width + x) * 4 + 3];
            if (alpha > 128) {
                // 随机选择淡粉色系
                const color = CONFIG.pinkPalette[Math.floor(Math.random() * CONFIG.pinkPalette.length)];
                
                points.push({
                    x: x - width / 2,
                    y: y - height / 2,
                    z: (Math.random() - 0.5) * 10, 
                    color: color
                });
            }
        }
    }
    
    // 洗牌
    for (let i = points.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [points[i], points[j]] = [points[j], points[i]];
    }
    
    return points.slice(0, CONFIG.particleCount);
}

// -----------------------------------------------------------
// 2. 粒子类
// -----------------------------------------------------------
class Particle {
    constructor() {
        this.x = (Math.random() - 0.5) * width;
        this.y = (Math.random() - 0.5) * height;
        this.z = (Math.random() - 0.5) * 1000;
        
        this.tx = 0; this.ty = 0; this.tz = 0;
        this.color = '#fff';
        
        // 呼吸闪烁
        this.baseSize = CONFIG.particleSize;
        this.flashOffset = Math.random() * Math.PI * 2;
        
        this.alpha = 0;
        this.tAlpha = 0;
    }

    update() {
        this.x += (this.tx - this.x) * currentTransitionSpeed;
        this.y += (this.ty - this.y) * currentTransitionSpeed;
        this.z += (this.tz - this.z) * currentTransitionSpeed;
        this.alpha += (this.tAlpha - this.alpha) * 0.1;
    }

    draw(ctx, centerX, centerY) {
        if (this.alpha < 0.01) return;

        const scale = CONFIG.focalLength / (CONFIG.focalLength + this.z);
        if (scale < 0) return;

        const screenX = this.x * scale + centerX;
        const screenY = this.y * scale + centerY;
        
        // 柔和的闪烁
        const shimmer = Math.sin(Date.now() * 0.003 + this.flashOffset);
        const size = this.baseSize * scale * (1.0 + shimmer * 0.2);

        ctx.globalAlpha = this.alpha; 
        ctx.fillStyle = this.color;
        ctx.beginPath();
        ctx.arc(screenX, screenY, size, 0, Math.PI * 2);
        ctx.fill();
        ctx.globalAlpha = 1;
    }
}

// -----------------------------------------------------------
// 3. 烟花系统 (加大版)
// -----------------------------------------------------------
class Firework {
    constructor() {
        this.x = Math.random() * width;
        this.y = height;
        this.targetY = height * 0.1 + Math.random() * height * 0.5; // 炸得更高更散
        this.vx = (Math.random() - 0.5) * 3;
        this.vy = -(12 + Math.random() * 5);
        
        // 烟花配色：粉、紫、金、银
        const r = Math.random();
        if (r > 0.7) this.hue = 330; // 粉红
        else if (r > 0.5) this.hue = 300; // 紫
        else if (r > 0.3) this.hue = 45; // 金
        else this.hue = 200; // 银/蓝白

        this.dead = false;
    }
    update() {
        this.x += this.vx;
        this.y += this.vy;
        this.vy += 0.15;
        if (this.vy >= 0 || this.y <= this.targetY) {
            this.explode();
            this.dead = true;
        }
    }
    draw(ctx) {
        ctx.lineWidth = 2.5;
        ctx.strokeStyle = `hsl(${this.hue}, 80%, 75%)`;
        ctx.beginPath();
        ctx.moveTo(this.x - this.vx, this.y - this.vy);
        ctx.lineTo(this.x, this.y);
        ctx.stroke();
    }
    explode() {
        // 增加爆炸粒子数
        const count = 150; 
        for (let i = 0; i < count; i++) {
            sparks.push(new Spark(this.x, this.y, this.hue));
        }
    }
}

class Spark {
    constructor(x, y, hue) {
        this.x = x; this.y = y; 
        this.oldX = x; this.oldY = y;
        const angle = Math.random() * Math.PI * 2;
        
        // 【关键】加大爆炸半径：速度范围从 6 提升到 11
        const speed = Math.random() * 9 + 2; 
        
        this.vx = Math.cos(angle) * speed;
        this.vy = Math.sin(angle) * speed;
        
        this.color = `hsl(${hue + (Math.random()-0.5)*30}, 90%, 70%)`;
        this.alpha = 1;
        // 减慢消失速度，让烟花看起来更大更持久
        this.decay = 0.01 + Math.random() * 0.01; 
    }
    update() {
        this.oldX = this.x; this.oldY = this.y;
        this.vx *= CONFIG.friction;
        this.vy *= CONFIG.friction;
        this.vy += CONFIG.gravity;
        this.x += this.vx;
        this.y += this.vy;
        this.alpha -= this.decay;
    }
    draw(ctx) {
        if(this.alpha<=0) return;
        ctx.lineWidth = 2.2;
        ctx.strokeStyle = this.color;
        ctx.globalAlpha = this.alpha;
        ctx.beginPath();
        ctx.moveTo(this.oldX, this.oldY);
        ctx.lineTo(this.x, this.y);
        ctx.stroke();
        ctx.globalAlpha = 1;
    }
}

// -----------------------------------------------------------
// 4. 流程控制
// -----------------------------------------------------------

for (let i = 0; i < CONFIG.particleCount; i++) {
    particles.push(new Particle());
}

function morph(content, fontSize, speed = 0.1) {
    currentTransitionSpeed = speed;

    let points = [];
    // 如果 content 为空字符串，则 points 为空，粒子会散开
    if (content) {
        points = getTextCoordinates(content, fontSize);
    }

    particles.sort(() => Math.random() - 0.5);

    particles.forEach((p, i) => {
        if (i < points.length) {
            p.tx = points[i].x;
            p.ty = points[i].y;
            p.tz = points[i].z;
            p.color = points[i].color;
            p.tAlpha = 1;
        } else {
            // 多余粒子 / 清空文字时：
            // 粒子向四面八方飞散，并变成星光
            const angle = Math.random() * Math.PI * 2;
            const r = width * 0.8 + Math.random() * width * 0.5;
            p.tx = Math.cos(angle) * r;
            p.ty = Math.sin(angle) * r;
            p.tz = (Math.random() - 0.5) * 500;
            p.tAlpha = 0; // 彻底消失
        }
    });
}

function launchBarrage(n) {
    for(let i=0; i<n; i++) setTimeout(() => fireworks.push(new Firework()), i*30);
}

// 时间轴
async function timeline() {
    let count = 10;
    
    // 倒计时开始
    morph(count.toString(), 250, 0.25);
    launchBarrage(5);

    const timer = setInterval(() => {
        count--;
        if (count >= 1) {
            morph(count.toString(), 250, 0.25);
            launchBarrage(8); 
        } else if (count === 0) {
            clearInterval(timer);
            startCelebration();
        }
    }, 1000);
}

function startCelebration() {
    // 2026
    morph("2026", 200, 0.1);
    launchBarrage(20); 

    setTimeout(() => {
        // 新年快乐
        morph("新年快乐", 160, 0.1);
        launchBarrage(10);
    }, 3500);

    setTimeout(() => {
        // 愿我们越来越好
        morph("愿我们越来越好", 120, 0.1);
        launchBarrage(15);
    }, 7500);
    
    // 【修改点】最后文字消失，满屏烟花
    setTimeout(() => {
        // 传入空字符串，粒子散开消失
        morph("", 0, 0.08);
        
        // 开启狂暴模式
        CONFIG.fireworkChance = 0.4; // 频率极高
        
        // 循环发射大齐射
        setInterval(() => {
             launchBarrage(Math.floor(Math.random() * 10 + 10));
        }, 800);
        
    }, 12000); // 12秒后进入终章
}

// -----------------------------------------------------------
// 5. 渲染
// -----------------------------------------------------------
let sceneRotationY = 0;

function animate() {
    // 背景
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = 'rgba(5, 0, 2, 0.2)'; 
    ctx.fillRect(0, 0, width, height);

    // 烟花 (Lighter)
    ctx.globalCompositeOperation = 'lighter';
    if(Math.random() < CONFIG.fireworkChance) fireworks.push(new Firework());

    fireworks.forEach((f,i) => {
        f.update(); f.draw(ctx);
        if(f.dead) fireworks.splice(i,1);
    });
    sparks.forEach((s,i) => {
        s.update(); s.draw(ctx);
        if(s.alpha<=0) sparks.splice(i,1);
    });

    // 文字粒子
    ctx.globalCompositeOperation = 'source-over'; 

    sceneRotationY = Math.sin(Date.now() * 0.0005) * 0.1;
    const cos = Math.cos(sceneRotationY);
    const sin = Math.sin(sceneRotationY);

    const renderList = [];
    particles.forEach(p => {
        p.update();
        if (p.alpha < 0.01) return;

        let x1 = p.x * cos - p.z * sin;
        let z1 = p.z * cos + p.x * sin;
        let y1 = p.y;

        const scale = CONFIG.focalLength / (CONFIG.focalLength + z1);
        const screenX = x1 * scale + width / 2;
        const screenY = y1 * scale + height / 2;

        p._screenX = screenX;
        p._screenY = screenY;
        p._z = z1;

        renderList.push(p);
    });

    // 排序
    renderList.sort((a, b) => b._z - a._z);

    renderList.forEach(p => {
        const oldZ = p.z;
        p.z = p._z;
        p.draw(ctx, p._screenX, p._screenY);
        p.z = oldZ;
    });

    requestAnimationFrame(animate);
}

animate();
timeline();

</script>
</body>
</html>
